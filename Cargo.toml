[workspace]
resolver = "2"
members = [
  "crates/omt-protocol",
  "crates/vmx-decoder",
  "crates/omt-receiver-core",
  "crates/omt-receiver",
  "crates/omt-web",
  "crates/omt-test-sender",
  "crates/omt-deployer-core",
  "crates/rpi-omt-deploy",
  "crates/rpi-omt-deployer",
]

[workspace.package]
version = "0.9.54"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
alsa = "0.12.1"
async-io = "2.6.0"
clap = { version = "4.5.48", features = ["derive"] }
drm = "0.15.0"
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui = "0.32.3"
hmac = "0.12.1"
libc = "0.2.176"
pbkdf2 = "0.12.2"
minijinja = "2.23.0"
nix = { version = "0.30.1", features = ["signal", "process"] }
futures-lite = "2.6.1"
getrandom = "0.3.3"
quick-xml = "0.41.0"
# Native folder and file pickers. The xdg-portal backend is the one that needs
# no GTK development headers, which is what keeps the Windows cross build and
# the Linux publisher on the same dependency set.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
rpassword = "7.4.0"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha1 = "0.10.6"
signal-hook = "0.3.18"
subtle = "2.6.1"
unicode-normalization = "0.1.24"
zbus = { version = "5.18.0", default-features = false, features = ["async-io"] }
zeroize = { version = "1.8.2", features = ["derive"] }
russh = { version = "0.62.5", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.4.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
large_stack_arrays = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
