[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "tests/.venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --tb=short"

[tool.coverage.run]
branch = true
source = ["src/omt_client"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "def main\\(",
]

[tool.mypy]
python_version = "3.11"
files = ["src/omt_client"]
strict = true
warn_unreachable = true
exclude = ["tests/.venv"]

[[tool.mypy.overrides]]
module = ["flask_limiter.*", "flask_wtf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["omt_client.factory", "omt_client.routes.*"]
disable_error_code = ["assignment", "no-untyped-def", "no-untyped-call"]
