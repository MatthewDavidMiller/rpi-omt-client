[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit/test_cross_file_invariants.py",
    "tests/unit/test_documentation.py",
    "tests/unit/test_runtime_validation.py",
]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
strict = true
warn_unreachable = true
exclude = ["tests/.venv"]

# scripts/lint.sh runs a second, relaxed mypy pass over tests/: real type errors
# are caught, but pytest fixtures and cases need not be annotated.
