[package]
name = "omt-sys"
description = "Hand-written declarations for the C library, OpenSSL, ALSA, the Linux uapi, and Win32"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Each library is linked only by the crates that ask for it, so the receiver
# never links libssl and the deployer never links ALSA.
openssl = []
ssl = ["openssl"]
alsa = []

[lints]
workspace = true
