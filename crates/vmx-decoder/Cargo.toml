[package]
name = "vmx-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# The workspace forbids unsafe outright. This crate carries the architecture
# specific VMX kernels, which the migration plan allows to use `std::arch`, so
# it downgrades that one lint to `deny` and re-states every other workspace
# lint verbatim. `unsafe_op_in_unsafe_fn` keeps each unsafe operation
# individually justified rather than blanketed by an unsafe function.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
format_collect = "allow"
large_stack_arrays = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"

