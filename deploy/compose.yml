services:
  omt-client:
    image: omt-client
    container_name: omt-client
    restart: unless-stopped
    # A 1080p receiver needs working room for decoded frames, but should not be
    # able to consume a low-memory Pi 5 host. The limit can be lowered only
    # after hardware validation through the root-owned installer environment.
    mem_limit: "${OMT_CONTAINER_MEMORY_LIMIT:-768m}"
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
      # Docker masks /proc/asound by default; ALSA needs it to enumerate cards.
      - systempaths=unconfined
    cap_drop:
      - ALL
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host-avahi/system-bus
      OMT_HDMI_CONNECTOR: "${OMT_HDMI_CONNECTOR:-auto}"
      OMT_DIAGNOSTICS_HOST_REPORT_FILE: /host-diagnostics/host-report.txt
      OMT_DIAGNOSTICS_HOST_REQUEST_FILE: /host-diagnostics/request
      OMT_DIAGNOSTICS_HOST_PCAP_FILE: /host-diagnostics/host-network.pcap
      OMT_DIAGNOSTICS_HOST_PCAP_METADATA_FILE: /host-diagnostics/host-network-pcap.txt
      OMT_REBOOT_REQUEST_FILE: /host-actions/reboot.request
      OMT_REBOOT_RESULT_FILE: /host-actions/reboot.result
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    volumes:
      - omt-config:/etc/omt
      - /var/lib/omt-client/avahi:/host-avahi:ro
      - /var/lib/omt-client/diagnostics:/host-diagnostics
      - /var/lib/omt-client/host-actions:/host-actions
      # Per-boot receiver state. The receiver republishes playback status on
      # every change and then at a heartbeat, so keeping it on the SD-card-backed
      # omt-config volume meant a continuous write + fsync + rename onto flash.
      # It is all state that must not survive a restart anyway. Capped because a
      # tmpfs is RAM; the lock, PID record, and status document total under 1 KB.
      - type: tmpfs
        target: /run/omt
        tmpfs:
          size: 1048576
          # 0o1777 in decimal, the one spelling every YAML parser in this repo
          # and in Compose reads identically. The mode must be explicit: the
          # default differs by engine (Docker 1777, Podman 700 owned by
          # container root), and this image runs as the unprivileged omt user,
          # which could not then create its own directory here.
          mode: 1023
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
          mode: 1023
    group_add:
      - "${OMT_VIDEO_GID:-27}"   # Alpine video
      - "${OMT_RENDER_GID:-27}"  # Alpine has no separate render group by default
      - "${OMT_AUDIO_GID:-18}"   # Alpine audio

volumes:
  omt-config:
    name: omt-config
    external: true
