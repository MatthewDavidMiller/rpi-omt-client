services:
  omt-client:
    image: omt-client
    container_name: omt-client
    restart: unless-stopped
    # Reap receiver descendants after failures and forward termination cleanly
    # instead of making the Rust Web process act as an init system as well.
    init: true
    # The receiver decodes into three scanout buffers with per-worker YUV
    # scratch, so the complete appliance stays inside a 128 MiB budget even on
    # the 512 MiB design target.
    mem_limit: "${OMT_CONTAINER_MEMORY_LIMIT:-128m}"
    memswap_limit: "${OMT_CONTAINER_MEMORY_LIMIT:-128m}"
    pids_limit: 64
    shm_size: 1048576
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host-avahi/system-bus
      OMT_HDMI_CONNECTOR: "${OMT_HDMI_CONNECTOR:-auto}"
      # The detected board and what it may attempt to decode. The installer
      # always writes both; the defaults are the Pi 5 tier so that a missing
      # variable never silently degrades an installed appliance.
      OMT_BOARD_LABEL: "${OMT_BOARD_LABEL:-Raspberry Pi}"
      OMT_VIDEO_CEILING: "${OMT_VIDEO_CEILING:-1920x1080@60}"
      OMT_DIAGNOSTICS_HOST_REPORT_FILE: /host-diagnostics/host-report.txt
      OMT_DIAGNOSTICS_HOST_REQUEST_FILE: /host-diagnostics/request
      OMT_DIAGNOSTICS_HOST_PCAP_FILE: /host-diagnostics/host-network.pcap
      OMT_DIAGNOSTICS_HOST_PCAP_METADATA_FILE: /host-diagnostics/host-network-pcap.txt
      OMT_REBOOT_REQUEST_FILE: /host-actions/reboot.request
      OMT_REBOOT_RESULT_FILE: /host-actions/reboot.result
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    volumes:
      - omt-config-v3:/etc/omt
      - /var/lib/omt-client/avahi:/host-avahi:ro
      - /var/lib/omt-client/diagnostics:/host-diagnostics
      - /var/lib/omt-client/host-actions:/host-actions
      # Per-boot receiver state. The receiver republishes playback status on
      # every change and then at a heartbeat, so keeping it on the SD-card-backed
      # config volume would put a permanent write load on flash for state that
      # must not survive a restart anyway. Capped because a tmpfs is RAM; the
      # lock, PID record, and status document total under 1 KB.
      - type: tmpfs
        target: /run/omt
        tmpfs:
          size: 1048576
          # 0o1777 in decimal, the one spelling every YAML parser in this repo
          # and in Compose reads identically. The mode must be explicit: the
          # default differs by engine (Docker 1777, Podman 700 owned by
          # container root), and this image runs as the unprivileged omt user,
          # which could not then create its own directory here.
          mode: 1023
      - type: tmpfs
        target: /tmp
        tmpfs:
          # Diagnostics ZIPs are built in process memory, not here; 16 MiB is
          # enough for mktemp and TLS scratch without reserving a 64 MiB slab
          # against the container cap.
          size: 16777216
          mode: 1023
    # Alpine has no render group: /dev/dri/renderD* is owned by video, so one
    # DRM entry covers both the card and the render node. A second, equal entry
    # is not merely redundant but fatal -- Compose requires group_add items to
    # be unique and refuses the service with "items at 0 and 1 are equal", so
    # the appliance container could not start at all. The installer checks the
    # render node really is in the video group and refuses if it ever is not.
    group_add:
      - "${OMT_VIDEO_GID:-27}"   # Alpine video: /dev/dri card and render node
      - "${OMT_AUDIO_GID:-18}"   # Alpine audio: /dev/snd

volumes:
  omt-config-v3:
    name: omt-config-v3
    external: true
