{% extends "base.html" %}
{% block title %}Login — {{ hostname }} OMT Client{% endblock %}
{% block content %}
<h1>Log in</h1>
<section class="card login-card" aria-labelledby="login-heading">
    <h2 id="login-heading">Appliance access</h2>
    {% if error %}
    <p class="notice notice-danger" role="alert">{{ error }}</p>
    {% endif %}
    <form method="POST" action="{{ url_for(request.endpoint) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="button">Log in</button>
    </form>
</section>
{% endblock %}
