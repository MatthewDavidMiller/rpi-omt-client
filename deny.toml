[advisories]
# RUSTSEC-2023-0071 (Marvin) remains open in every rsa crate release. Russh
# pulls it in for optional RSA host/user keys; Ed25519 and ECDSA paths are
# unaffected. Ignore until an upstream constant-time rsa lands.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "unfixed in rsa; deployer prefers Ed25519/ECDSA, RSA retained only for legacy keys" },
]

[licenses]
# Exactly the licenses the shipped closure actually carries. An allowance that
# matches nothing is reported as `license-not-encountered` on every run, which
# buries the one that would matter.
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other by path. cargo-deny treats a path
# dependency without an explicit version as a wildcard; pinning the workspace
# version on each path edge keeps the ban meaningful for registry crates.
wildcards = "deny"
deny = [
  { name = "openssl" },
  { name = "libssh2-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
