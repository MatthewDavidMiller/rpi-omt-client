# The stable release every shipped binary is built with. scripts/install-rust.sh
# installs this exact release (and the dated nightly the sanitizer and fuzz
# gates use) in the toolbox; tests/unit/test_supply_chain.sh holds the two to
# one version.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-gnu"]
